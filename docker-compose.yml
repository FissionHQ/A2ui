services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env.local
    environment:
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 8

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
